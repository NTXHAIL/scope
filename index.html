<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HailSpec">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>HailSpec — NTX Hail Estimator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='5' fill='%230a1628'/%3E%3Ctext x='4' y='19' font-family='sans-serif' font-weight='900' font-size='13' fill='white'%3ENTX%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap"></noscript>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; min-height: 100%; max-width: 100%; overflow-x: hidden; }
    body { font-family: "DM Sans", "Segoe UI", system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    button, input, select, textarea { font-family: inherit; }
    button { touch-action: manipulation; }
    input, select, textarea { font-size: 16px !important; }
    img, svg { max-width: 100%; }
    a:focus-visible, button:focus-visible, [role="button"]:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }
    .print-sheet { display: none; }
    @media print {
      html, body, #root { overflow: visible !important; background: #fff !important; height: auto !important; max-width: none !important; }
      .app-screen { display: none !important; }
      .print-sheet {
        display: block !important;
        color: #000;
        font-family: "Courier New", Courier, monospace;
        font-size: 11px;
        line-height: 1.35;
      }
      .print-brand { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
      .print-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
      .print-header { border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 10px; }
      .print-header h1 { font-size: 16px; margin: 8px 0 4px; }
      .print-sheet h2 { font-size: 12px; margin: 12px 0 4px; letter-spacing: 0.4px; }
      .print-sheet table { width: 100%; border-collapse: collapse; margin-top: 6px; }
      .print-sheet th { border-bottom: 1px solid #000; text-align: left; padding: 4px; font-size: 10px; letter-spacing: 0.3px; text-transform: uppercase; }
      .print-sheet td { border-bottom: 1px solid #bbb; padding: 4px; vertical-align: top; }
      .print-group td { border-bottom: 1px solid #000; font-weight: 700; padding-top: 8px; }
      .print-sheet .amt { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .print-total td { border-top: 2px solid #000; font-weight: 700; }
      .print-photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .print-photos img { width: 140px; height: 100px; object-fit: cover; }
      .print-footer { margin-top: 18px; font-size: 10px; }
      @page { size: letter; margin: 0.55in; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
